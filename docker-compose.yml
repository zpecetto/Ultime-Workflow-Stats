volumes:
  n8n_data: {}
services:
  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:latest}
    container_name: n8n
    restart: always
    ports:
    - 5678:5678
    extra_hosts:
    - host.docker.internal:host-gateway
    environment:
    - N8N_SECURE_COOKIE=false
    - NODE_FUNCTION_ALLOW_ENV=N8N_VERSION
    - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
    - N8N_BLOCK_BROWSER_NAME_CHECK=true
    - N8N_COMMAND_EXECUTION_ENABLED=true
    - NODE_FUNCTION_ALLOW_BUILTIN=*
    - GENERIC_TIMEZONE=Europe/Paris
    - N8N_RUNNERS_TASK_TIMEOUT=3600
    - N8N_AI_TIMEOUT=3600000
    - N8N_RECURSION_LIMIT=50
    volumes:
    - n8n_data:/home/node/.n8n
    - ${MUSIC_HOST_DIR:-./Musique}:/home/node/.n8n-files
    depends_on:
    - browserless
    deploy:
      resources:
        limits:
          memory: 4G
  browserless:
    image: ghcr.io/browserless/chromium:latest
    container_name: browserless
    restart: always
    ports:
    - 3000:3000
    dns:
    - 8.8.8.8
    - 1.1.1.1
    environment:
    - TIMEOUT=1200000
    - MAX_CONCURRENT_SESSIONS=3
    - MAX_QUEUE_LENGTH=5
    deploy:
      resources:
        limits:
          memory: 2G
  audible-api:
    build:
      context: ./audible-api
    container_name: audible-api
    restart: unless-stopped
    ports:
    - 8010:8000
    volumes:
    - ./audible-api/audible-data:/data
    environment:
    - AUDIBLE_COUNTRY_CODE=fr
    - AUDIBLE_AUTH_FILE=/data/audible_auth.json
    deploy:
      resources:
        limits:
          memory: 512M
    profiles:
    - audible
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    environment:
    - WATCHTOWER_CLEANUP=true
    - WATCHTOWER_SCHEDULE=0 0 4 * * *
    profiles:
    - maintenance
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    ports:
    - 11434:11434
    volumes:
    - ./ollama_data:/root/.ollama
    environment:
    - OLLAMA_ORIGINS=*
    deploy:
      resources:
        limits:
          memory: 8G
